[package]
name = "balacopapo-pointer-overlay"
version = "0.1.0"
description = "Overlay externo nativo, transparente e click-through (0% CPU ociosa, anti-cheat safe) para a função de apontar em transmissões do Balacopapo"
authors = ["RichardDavid7"]
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "balacopapo-pointer-overlay"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
