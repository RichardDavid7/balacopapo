<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balacopapo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="card" aria-labelledby="title">
        <div class="brand">
          <div class="logo-badge" aria-hidden="true">B</div>
          <div>
            <h1 id="title">Balacopapo</h1>
            <p class="subtitle">Cliente desktop leve · Tauri v2 + Rust</p>
          </div>
        </div>

        <form id="connect-form" class="form" novalidate>
          <label for="instance-url" class="label">URL da sua instância Balacopapo</label>
          <input
            id="instance-url"
            name="instanceUrl"
            type="url"
            placeholder="https://balacopapo.seudominio.com"
            autocomplete="url"
            spellcheck="false"
            required
          />
          <p id="error-msg" class="error" role="alert" hidden></p>

          <label class="toggle-row">
            <input id="standby-toggle" type="checkbox" checked />
            <span>
              <strong>Modo Standby na bandeja</strong>
              <small>Descarrega a interface ao fechar para a bandeja (~10–15 MB de RAM).</small>
            </span>
          </label>

          <button id="connect-btn" type="submit" class="btn-primary">Conectar</button>
        </form>

        <footer class="footer">
          <span id="app-version">v0.1.0</span>
          <button id="check-update-btn" type="button" class="btn-link">Verificar atualizações</button>
        </footer>
        <p id="update-note" class="update-note" hidden></p>
      </section>
    </main>

    <script src="./launcher.js"></script>
  </body>
</html>
