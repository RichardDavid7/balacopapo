[package]
name = "balacopapo-desktop"
version = "0.3.0"
description = "Cliente desktop híbrido (Tauri v2 + WebView do SO + Motor Nativo Rust) para o Balacopapo"
authors = ["RichardDavid7"]
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "balacopapo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
directories = "5"
open = "5"
cpal = "0.15"
rtrb = "0.3"
nnnoiseless = "0.5"
hound = "3.5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
image = { version = "0.25", default-features = false, features = ["ico", "png", "jpeg", "webp", "gif"] }
notify-rust = "4"
livekit = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
