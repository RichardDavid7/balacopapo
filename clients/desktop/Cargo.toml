[package]
name = "balacopapo-desktop"
version = "0.2.0"
description = "Cliente desktop 100% nativo (Rust + Iced + wgpu, Zero WebView) para o Balacopapo"
authors = ["RichardDavid7"]
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "balacopapo-desktop"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", features = ["tokio", "wgpu", "svg", "image", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
directories = "5"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
