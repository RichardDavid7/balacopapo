[package]
name = "wasapi_loopback"
version = "0.1.0"
edition = "2021"
description = "Windows WASAPI Process Loopback native Node-API addon for Balacopapo Desktop"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_UI_WindowsAndMessaging",
] }
