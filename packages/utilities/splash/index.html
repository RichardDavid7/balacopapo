<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Balacopapo Utilidades</title>
<style>
html,body{height:100%;margin:0;background:#0e0c15;color:#eeeaf8;font:14px "Segoe UI",system-ui,sans-serif;display:grid;place-items:center}
.box{text-align:center}
.spin{width:34px;height:34px;border:3px solid #2c2742;border-top-color:#7c5cff;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <div>Iniciando Balacopapo Utilidades…</div>
</div>
</body>
</html>
