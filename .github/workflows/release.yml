name: Release Balacopapo (Server + Windows + Linux + Android)

# Unified multi-platform release workflow.
# Pushing a version tag (e.g. `v0.1.0` or `v0.1.0-alpha.1`) builds and publishes
# all Balacopapo artifacts under a single GitHub Release:
#   - Server + Web container image on GHCR (`ghcr.io/<owner>/balacopapo`)
#   - Desktop installers for Windows (.exe, .msi) and Linux (.AppImage, .deb)
#   - Android native client (.apk + SHA256SUMS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Resolve release metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG_NAME#v}"
          if [[ "${TAG_NAME}" =~ -(alpha|beta|rc) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: "Balacopapo ${{ steps.meta.outputs.tag_name }}"
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Balacopapo ${{ steps.meta.outputs.tag_name }}

            ### Servidor (Docker / GHCR)
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ```

            ### Clientes anexados nesta Release
            - **Windows:** instalador `.exe` (NSIS) e `.msi`
            - **Linux:** `.AppImage` e `.deb`
            - **Android:** `.apk` (compatível com Obtainium) + `SHA256SUMS-android.txt`

  server-docker:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build metadata
        id: meta_commit
        run: echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare-release.outputs.is_prerelease != 'true' }}
            type=sha
          labels: |
            org.opencontainers.image.title=Balacopapo
            org.opencontainers.image.description=Self-hosted voice, video, and chat platform (server + web client).
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            BACKSPACE_COMMIT=${{ steps.meta_commit.outputs.commit }}
          sbom: true
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-clients:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop/src-tauri

      - name: Determine Tauri build args (signed auto-update vs unsigned)
        id: build_cfg
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret found; building installers without updater signatures."
            echo 'args=--config {"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and attach Desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: clients/desktop
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: "Balacopapo ${{ needs.prepare-release.outputs.tag_name }}"
          releaseDraft: false
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          args: ${{ steps.build_cfg.outputs.args }}

  android-client:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          gradle-home-cache-cleanup: true

      - name: Decode Release Keystore (if configured)
        id: signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "keystore_file=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Run Android Unit Tests
        run: gradle :core:model:test testDebugUnitTest

      - name: Build Signed Release APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ steps.signing.outputs.keystore_file }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PversionName="${{ needs.prepare-release.outputs.version }}" \
            -PversionCode="${{ needs.prepare-release.outputs.version_code }}"

      - name: Build Debug APK (Fallback when Release Keystore is not set)
        if: steps.signing.outputs.has_keystore != 'true'
        run: |
          gradle assembleDebug \
            -PversionName="${{ needs.prepare-release.outputs.version }}" \
            -PversionCode="${{ needs.prepare-release.outputs.version_code }}"

      - name: Package APK & Checksums
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          OUT_APK="dist/Balacopapo-${{ needs.prepare-release.outputs.tag_name }}-android.apk"
          cp "$SRC_APK" "$OUT_APK"
          (cd dist && sha256sum "$(basename "$OUT_APK")" > SHA256SUMS-android.txt)
          ls -lh dist/

      - name: Attach Android APK to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          files: |
            clients/android/dist/*.apk
            clients/android/dist/SHA256SUMS-android.txt
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
