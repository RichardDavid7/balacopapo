name: Utilities Release (Windows & Linux)

# Compila o Balacopapo Utilidades (Windows + Linux) automaticamente em todo push
# na `main` que altere `packages/utilities/**` (atualizando a pré-release `utilities-edge`)
# e também ao criar tags `utilities-v*` (release oficial).
on:
  push:
    branches:
      - main
    paths:
      - 'packages/utilities/**'
      - 'packages/shared/src/types.ts'
      - '.github/workflows/utilities-release.yml'
  workflow_dispatch:

concurrency:
  group: utilities-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, node-os: win, node-ext: zip }
          - { os: ubuntu-latest, target: linux-x64, node-os: linux, node-ext: tar.xz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck + testes
        run: |
          pnpm --filter @backspace/shared build
          pnpm --filter @backspace/utilities typecheck
          pnpm --filter @backspace/utilities test

      - name: Montar pacote portátil
        shell: bash
        run: |
          pnpm --filter @backspace/utilities deploy --prod --legacy dist/app
          NODE_VERSION=$(node -p "process.versions.node")
          NODE_NAME="node-v${NODE_VERSION}-${{ matrix.node-os }}-x64"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_NAME}.${{ matrix.node-ext }}" -o node-archive
          mkdir -p dist/pkg/runtime
          if [ "${{ matrix.node-ext }}" = "zip" ]; then
            unzip -q node-archive -d node-extract
          else
            mkdir node-extract && tar -xf node-archive -C node-extract
          fi
          cp -r node-extract/${NODE_NAME}/* dist/pkg/runtime/
          cp -r dist/app dist/pkg/app
          rm -rf dist/pkg/app/src/*.test.ts
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            printf '@echo off\r\ncd /d "%%~dp0app"\r\n"%%~dp0runtime\\node.exe" node_modules\\tsx\\dist\\cli.mjs src\\index.ts\r\n' > dist/pkg/Balacopapo-Utilidades.bat
          else
            printf '#!/bin/sh\ncd "$(dirname "$0")/app" || exit 1\nexec "../runtime/bin/node" node_modules/tsx/dist/cli.mjs src/index.ts "$@"\n' > dist/pkg/balacopapo-utilidades.sh
            chmod +x dist/pkg/balacopapo-utilidades.sh
          fi

      - name: Compactar
        shell: bash
        run: |
          mv dist/pkg "balacopapo-utilidades-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            7z a "balacopapo-utilidades-${{ matrix.target }}.zip" "balacopapo-utilidades-${{ matrix.target }}" > /dev/null
          else
            tar -czf "balacopapo-utilidades-${{ matrix.target }}.tar.gz" "balacopapo-utilidades-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: balacopapo-utilidades-${{ matrix.target }}
          path: |
            balacopapo-utilidades-*.zip
            balacopapo-utilidades-*.tar.gz

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Publicar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/utilities-v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="Balacopapo Utilidades ${TAG}"
            FLAGS=""
          else
            TAG="utilities-edge"
            TITLE="Balacopapo Utilidades (Edge — ${SHORT_SHA})"
            FLAGS="--prerelease"
          fi

          NOTES="Bot de música portátil (Windows/Linux) — commit \`${SHORT_SHA}\`. Extraia e execute o launcher (\`Balacopapo-Utilidades.bat\` no Windows ou \`balacopapo-utilidades.sh\` no Linux)."

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* ${FLAGS} --target "${GITHUB_SHA}" --title "${TITLE}" --notes "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi
