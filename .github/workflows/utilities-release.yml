name: Utilities Release (Windows & Linux)

# Compila o Balacopapo Utilidades (Windows + Linux) automaticamente em todo push
# na `main` que altere `packages/utilities/**` (atualizando a pré-release `utilities-edge`).
on:
  push:
    branches:
      - main
    paths:
      - 'packages/utilities/**'
      - 'packages/shared/src/types.ts'
      - '.github/workflows/utilities-release.yml'
  workflow_dispatch:

concurrency:
  group: utilities-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, node-os: win, node-ext: zip }
          - { os: ubuntu-latest, target: linux-x64, node-os: linux, node-ext: tar.xz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build, typecheck e testes
        run: |
          pnpm --filter @backspace/shared build
          pnpm --filter @backspace/utilities typecheck
          pnpm --filter @backspace/utilities test
          pnpm --filter @backspace/utilities build

      - name: Montar pacote portátil
        shell: bash
        run: |
          pnpm --filter @backspace/utilities deploy --prod --legacy dist/app
          cp -r packages/utilities/dist dist/app/dist
          rm -rf dist/app/src dist/app/launcher dist/app/tsconfig.json

          NODE_VERSION=$(node -p "process.versions.node")
          NODE_NAME="node-v${NODE_VERSION}-${{ matrix.node-os }}-x64"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_NAME}.${{ matrix.node-ext }}" -o node-archive
          mkdir -p dist/pkg/runtime
          if [ "${{ matrix.node-ext }}" = "zip" ]; then
            unzip -q node-archive -d node-extract
          else
            mkdir node-extract && tar -xf node-archive -C node-extract
          fi
          cp -r node-extract/${NODE_NAME}/* dist/pkg/runtime/
          cp -r dist/app dist/pkg/app

          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            MSYS_NO_PATHCONV=1 "/c/Windows/Microsoft.NET/Framework64/v4.0.30319/csc.exe" \
              -nologo -target:winexe -optimize+ \
              -win32icon:clients/Desktop/src-tauri/icons/icon.ico \
              -r:System.Windows.Forms.dll -r:System.Drawing.dll \
              -out:dist/pkg/Balacopapo-Utilidades.exe \
              packages/utilities/launcher/Launcher.cs
          else
            printf '#!/bin/sh\ncd "$(dirname "$0")/app" || exit 1\nexec "../runtime/bin/node" dist/index.js "$@"\n' > dist/pkg/balacopapo-utilidades
            chmod +x dist/pkg/balacopapo-utilidades
          fi

      - name: Compactar
        shell: bash
        run: |
          mv dist/pkg "balacopapo-utilidades-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            7z a "balacopapo-utilidades-${{ matrix.target }}.zip" "balacopapo-utilidades-${{ matrix.target }}" > /dev/null
          else
            tar -czf "balacopapo-utilidades-${{ matrix.target }}.tar.gz" "balacopapo-utilidades-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: balacopapo-utilidades-${{ matrix.target }}
          path: |
            balacopapo-utilidades-*.zip
            balacopapo-utilidades-*.tar.gz

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Publicar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="utilities-edge"
          TITLE="Balacopapo Utilidades (Edge — ${SHORT_SHA})"
          NOTES="Bot de música portátil (Windows/Linux) — commit \`${SHORT_SHA}\`. Extraia e abra \`Balacopapo-Utilidades.exe\` (Windows, fica na bandeja do sistema) ou \`./balacopapo-utilidades\` (Linux)."

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* --prerelease --target "${GITHUB_SHA}" --title "${TITLE}" --notes "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi
