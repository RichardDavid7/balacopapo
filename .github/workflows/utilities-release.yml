name: Utilities Release (Windows & Linux)

# Compila o Balacopapo Utilidades (app nativo Tauri v2 + worker de música)
# automaticamente em todo push na `main` que altere `packages/utilities/**`
# (atualizando a pré-release `utilities-edge`).
on:
  push:
    branches:
      - main
    paths:
      - 'packages/utilities/**'
      - 'packages/shared/src/types.ts'
      - '.github/workflows/utilities-release.yml'
  workflow_dispatch:

concurrency:
  group: utilities-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, node-os: win, node-ext: zip }
          - { os: ubuntu-22.04, target: linux-x64, node-os: linux, node-ext: tar.xz }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências Linux do Tauri
        if: matrix.target == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/utilities/src-tauri

      - run: pnpm install --frozen-lockfile
      - name: Build, typecheck e testes (Node)
        run: |
          pnpm --filter @backspace/shared build
          pnpm --filter @backspace/utilities typecheck
          pnpm --filter @backspace/utilities test
          pnpm --filter @backspace/utilities build

      - name: Compilar janela nativa (Tauri v2)
        run: cargo build --release --manifest-path packages/utilities/src-tauri/Cargo.toml

      - name: Montar pacote portátil
        shell: bash
        run: |
          mkdir -p dist/pkg/app dist/pkg/runtime
          node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('packages/utilities/package.json','utf8'));delete p.devDependencies;fs.writeFileSync('dist/pkg/app/package.json',JSON.stringify(p,null,2));"
          cp -r packages/utilities/dist dist/pkg/app/dist

          # Usa npm install --omit=dev para gerar node_modules plano (sem symlinks do pnpm que quebram no .zip)
          (cd dist/pkg/app && npm install --omit=dev --no-audit --no-fund)

          NODE_VERSION=$(node -p "process.versions.node")
          NODE_NAME="node-v${NODE_VERSION}-${{ matrix.node-os }}-x64"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_NAME}.${{ matrix.node-ext }}" -o node-archive
          if [ "${{ matrix.node-ext }}" = "zip" ]; then
            unzip -q node-archive -d node-extract
          else
            mkdir node-extract && tar -xf node-archive -C node-extract
          fi
          cp -r node-extract/${NODE_NAME}/* dist/pkg/runtime/

          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            cp packages/utilities/src-tauri/target/release/balacopapo-utilidades.exe dist/pkg/Balacopapo-Utilidades.exe
            dist/pkg/runtime/node.exe dist/pkg/app/dist/index.js --check
          else
            cp packages/utilities/src-tauri/target/release/balacopapo-utilidades dist/pkg/balacopapo-utilidades
            chmod +x dist/pkg/balacopapo-utilidades
            dist/pkg/runtime/bin/node dist/pkg/app/dist/index.js --check
          fi

      - name: Compactar
        shell: bash
        run: |
          mv dist/pkg "balacopapo-utilidades-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "windows-x64" ]; then
            7z a "balacopapo-utilidades-${{ matrix.target }}.zip" "balacopapo-utilidades-${{ matrix.target }}" > /dev/null
          else
            tar -czf "balacopapo-utilidades-${{ matrix.target }}.tar.gz" "balacopapo-utilidades-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: balacopapo-utilidades-${{ matrix.target }}
          path: |
            balacopapo-utilidades-*.zip
            balacopapo-utilidades-*.tar.gz

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Publicar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="utilities-edge"
          TITLE="Balacopapo Utilidades (Edge — ${SHORT_SHA})"
          NOTES="App desktop nativo (Tauri v2 + bot de música) para Windows e Linux — commit \`${SHORT_SHA}\`. Extraia e abra \`Balacopapo-Utilidades.exe\` (Windows) ou \`./balacopapo-utilidades\` (Linux)."

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* --prerelease --target "${GITHUB_SHA}" --title "${TITLE}" --notes "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi
