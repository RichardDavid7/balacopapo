name: Balacopapo Desktop CI & Edge Release (Electron — Win & Linux)

on:
  push:
    branches: [main]
    paths:
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - '.github/workflows/desktop-native-ci.yml'
  pull_request:
    paths:
      - 'packages/desktop/**'
      - '.github/workflows/desktop-native-ci.yml'
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Electron Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows-x64, flag: --win --x64 }
          - { os: ubuntu-22.04, target: linux-x64, flag: --linux --x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.3 --activate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @backspace/desktop...

      - name: Run desktop unit tests
        run: pnpm --filter @backspace/desktop test

      - name: TypeScript build
        run: pnpm --filter @backspace/desktop build:ts

      - name: Package installer (${{ matrix.target }})
        working-directory: packages/desktop
        run: pnpm exec electron-builder ${{ matrix.flag }} --publish never

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: balacopapo-desktop-${{ matrix.target }}
          path: |
            packages/desktop/dist-electron/*.exe
            packages/desktop/dist-electron/*.AppImage
            packages/desktop/dist-electron/*.deb
            packages/desktop/dist-electron/*.blockmap
            packages/desktop/dist-electron/latest*.yml

  publish-edge:
    name: Publicar Balacopapo Desktop (Edge)
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Publicar ou atualizar release desktop-edge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="desktop-edge"
          TITLE="Balacopapo Desktop (Edge — ${SHORT_SHA})"
          NOTES="Balacopapo Desktop (Electron + OverlayManager + uIOhook + PipeWire) para Windows e Linux — commit ${SHORT_SHA}. Windows: instale com Balacopapo-*-win-x64.exe (NSIS, zero barra flutuante, zero dependencia de WebView2). Linux: use .AppImage ou .deb."

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit "${TAG}" --title "${TITLE}" --notes "${NOTES}" --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/* --prerelease --target "${GITHUB_SHA}" --title "${TITLE}" --notes "${NOTES}" --repo "${GITHUB_REPOSITORY}"
          fi
